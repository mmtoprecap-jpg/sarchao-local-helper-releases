name: Build Windows Helper

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          choco install ffmpeg -y --no-progress
          Copy-Item (Get-Command ffmpeg).Source ffmpeg.exe
      - name: Prepare build inputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vendor/yt_dlp_plugins | Out-Null
      - name: Build executable
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm Sarchao-Local-Helper.spec
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sarchao-Local-Helper-v1.7
          path: dist/Sarchao-Local-Helper.exe
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/Sarchao-Local-Helper.exe
